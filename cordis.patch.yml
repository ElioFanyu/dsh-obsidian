# Obsidian Vault Connection — merged plugin
#
# This single bundle replaces the former pair (dsh-obsidian-mcp + the separate
# obsidian-mcp-runtime directory). The MCP server now lives inside this package
# at ./server/node_modules/obsidian-mcp, so installing this one bundle is enough.
#
# The server is obsidian-mcp 2.0.1 running on DSH's own Node (process.execPath),
# which satisfies its Node >= 22 requirement without a system Node install.
# It reads and writes plain Markdown files, so Obsidian itself need not be
# running.
#
# Two rows are inserted:
#
#   obsidian-mcp        the MCP server itself (the tools the model calls)
#   dsh-obsidian        this bundle's host half: validates the --vault arguments
#                       below, checks that this row still starts the bundled
#                       server, and publishes both on
#                       /plugins/dsh-obsidian/health, so a wrong vault path or a
#                       stale path is reported instead of silently hiding every
#                       tool.
#
# Tools appear to the model as mcp__obsidian__<tool>, for example
# mcp__obsidian__obsidian_read_note and mcp__obsidian__obsidian_search_vault.
#
# To expose another vault, add a second `--vault <id>=<absolute-path>` pair to
# the args below (forward slashes; up to ten vaults) and restart DSH. After the
# edit, GET /plugins/dsh-obsidian/health to confirm both vaults resolve.
- insert:
    - id: obsidian-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: obsidian
        transport: stdio
        # DSH's own Node runs the vendored server, so no system Node is needed.
        # On the desktop build this is the Electron binary with
        # ELECTRON_RUN_AS_NODE=1, which `env` below sets for the child.
        command: !!js process.execPath
        # The vendored server's package directory. The entry script in `args` is
        # resolved relative to it. These two lines are the only place that names
        # an absolute location; if the plugin moves, update `cwd` here. The
        # health route reports a mismatch (launch.cwdMatchesBundled: false) and
        # prints the correct path, so a stale value is diagnosed rather than
        # guessed at.
        cwd: D:/Workspace/DeepSeek Harness/dsh-obsidian/server
        args:
          - node_modules/obsidian-mcp/dist/main.js
          - serve
          - --vault
          - main=D:/Workspace/Obsidian
        env:
          ELECTRON_RUN_AS_NODE: '1'
        # Make a failed connection or a failed first tool sync reject this row's
        # activation, which DSH reports as a labelled warning. This row is not in
        # DSH's required-entry list, so the warning does not abort startup; set
        # this to false to suppress even that warning and run without Obsidian
        # tools. Vault-path problems are reported by the health route either way.
        failOnStartupError: true
    - id: dsh-obsidian
      name: dsh-obsidian
